name: Backend CI

on:
  workflow_dispatch:
  push:
    branches:
      - backend

jobs:
  debug:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Show Repository Structure
        run: |
          pwd
          ls -la
          echo "====== ROOT FILES ======"
          find . -maxdepth 2 -type d
